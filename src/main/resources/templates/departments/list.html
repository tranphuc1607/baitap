<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Phòng ban - Enterprise HR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-dark text-light">
    <div class="container py-5">
        <!-- Thanh tiêu đề & Nút quay lại cấp cao -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/employees}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-arrow-left"></i> Quay lại Nhân sự
                </a>
                <h1 class="h3 mb-0 text-info fw-bold">
                    <i class="bi bi-building-gear"></i> Quản lý Phòng ban
                </h1>
            </div>
            <div>
                <a th:href="@{/departments/new}" class="btn btn-success shadow-sm">
                    <i class="bi bi-plus-lg"></i> Thêm phòng ban
                </a>
            </div>
        </div>

        <!-- Bảng danh sách phong cách Dashboard / CI-CD Management -->
        <div class="card bg-secondary bg-opacity-10 border-secondary shadow-lg">
            <div class="card-body p-0">
                <table class="table table-dark table-hover table-striped align-middle mb-0">
                    <thead class="table-dark border-bottom border-secondary text-uppercase fs-7">
                        <tr>
                            <th scope="col" class="py-3 ps-4">#ID</th>
                            <th scope="col" class="py-3">Tên phòng ban</th>
                            <th scope="col" class="py-3">Địa điểm / Tầng làm việc</th>
                            <th scope="col" class="py-3 text-center pe-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="dept : ${departments}">
                            <th scope="row" class="ps-4 font-monospace text-warning" th:text="${dept.id}">1</th>
                            <td class="fw-bold text-white" th:text="${dept.name}">IT</td>
                            <td>
                                <span class="badge bg-dark border border-secondary text-light px-2 py-1" th:text="${dept.location}">Tầng 5 - Tòa nhà A</span>
                            </td>
                            <td class="text-center pe-4">
                                <a th:href="@{/departments/edit/{id}(id=${dept.id})}" class="btn btn-outline-warning btn-sm me-1">
                                    <i class="bi bi-pencil-square"></i> Sửa
                                </a>
                                <a th:href="@{/departments/delete/{id}(id=${dept.id})}" 
                                   class="btn btn-outline-danger btn-sm" 
                                   onclick="return confirm('Lưu ý: Xóa phòng ban có thể ảnh hưởng đến các nhân viên thuộc phòng này. Bạn có chắc chắn?')">
                                   <i class="bi bi-trash"></i> Xóa
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(departments)}">
                            <td colspan="4" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                Chưa có phòng ban nào trong hệ thống.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
