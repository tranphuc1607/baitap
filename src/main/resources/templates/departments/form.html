<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin Phòng ban - Enterprise HR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-dark text-light">
    <div class="container py-5" style="max-width: 650px;">
        <!-- Nút Quay lại danh sách -->
        <div class="mb-4">
            <a th:href="@{/departments}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Quay lại danh sách
            </a>
        </div>

        <!-- Thẻ Form Card -->
        <div class="card bg-secondary bg-opacity-10 border-secondary shadow-lg">
            <div class="card-header bg-dark border-bottom border-secondary py-3">
                <h4 class="mb-0 text-info fw-bold">
                    <i class="bi bi-building-add"></i> 
                    <span th:text="${department.id == null} ? 'Thêm mới Phòng ban' : 'Cập nhật Phòng ban'"></span>
                </h4>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/departments/save}" th:object="${department}" method="post">
                    <!-- Hidden ID nếu là cập nhật -->
                    <input type="hidden" th:field="*{id}" />

                    <!-- Tên phòng ban -->
                    <div class="mb-3">
                        <label class="form-label fw-bold text-light">Tên phòng ban <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{name}" class="form-control bg-dark text-light border-secondary" placeholder="Ví dụ: Phòng Công nghệ Thông tin, Nhân sự..." required />
                    </div>

                    <!-- Địa điểm / Tầng làm việc -->
                    <div class="mb-4">
                        <label class="form-label fw-bold text-light">Địa điểm / Tầng làm việc</label>
                        <input type="text" th:field="*{location}" class="form-control bg-dark text-light border-secondary" placeholder="Ví dụ: Tầng 5 - Tòa nhà A" />
                    </div>

                    <!-- Các nút thao tác -->
                    <div class="d-flex justify-content-end gap-2 pt-3 border-top border-secondary">
                        <a th:href="@{/departments}" class="btn btn-outline-secondary">Hủy bỏ</a>
                        <button type="submit" class="btn btn-success px-4">
                            <i class="bi bi-check-lg"></i> Lưu dữ liệu
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
