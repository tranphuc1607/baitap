<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin Nhân viên - Enterprise HR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-dark text-light">
    <div class="container py-5" style="max-width: 650px;">
        <!-- Nút Quay lại danh sách -->
        <div class="mb-4">
            <a th:href="@{/employees}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Quay lại danh sách
            </a>
        </div>

        <!-- Thẻ Form Card -->
        <div class="card bg-secondary bg-opacity-10 border-secondary shadow-lg">
            <div class="card-header bg-dark border-bottom border-secondary py-3">
                <h4 class="mb-0 text-info fw-bold">
                    <i class="bi bi-person-badge"></i> 
                    <span th:text="${employee.id == null} ? 'Thêm mới Nhân viên' : 'Cập nhật Nhân viên'"></span>
                </h4>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/employees/save}" th:object="${employee}" method="post">
                    <!-- Hidden ID nếu là cập nhật -->
                    <input type="hidden" th:field="*{id}" />

                    <!-- Họ và tên -->
                    <div class="mb-3">
                        <label class="form-label fw-bold text-light">Họ và tên <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{fullName}" class="form-control bg-dark text-light border-secondary" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" placeholder="Nhập họ tên nhân viên" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label fw-bold text-light">Email <span class="text-danger">*</span></label>
                        <input type="email" th:field="*{email}" class="form-control bg-dark text-light border-secondary" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="example@domain.com" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <!-- Lương -->
                    <div class="mb-3">
                        <label class="form-label fw-bold text-light">Mức lương cơ bản <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" th:field="*{salary}" class="form-control bg-dark text-light border-secondary" th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid'" placeholder="Ví dụ: 1000.0" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                    </div>

                    <!-- Phòng ban -->
                    <div class="mb-4">
                        <label class="form-label fw-bold text-light">Phòng ban trực thuộc <span class="text-danger">*</span></label>
                        <select th:field="*{department.id}" class="form-select bg-dark text-light border-secondary" required>
                            <option value="">-- Chọn phòng ban --</option>
                            <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                        </select>
                    </div>

                    <!-- Các nút thao tác -->
                    <div class="d-flex justify-content-end gap-2 pt-3 border-top border-secondary">
                        <a th:href="@{/employees}" class="btn btn-outline-secondary">Hủy bỏ</a>
                        <button type="submit" class="btn btn-success px-4">
                            <i class="bi bi-check-lg"></i> Lưu dữ liệu
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
