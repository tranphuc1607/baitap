<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Nhân sự - Enterprise HR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-dark text-light">
    <div class="container py-5">
        <!-- Thanh tiêu đề & Điều hướng -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/departments}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-arrow-left"></i> Quay lại Phòng ban
                </a>
                <h1 class="h3 mb-0 text-info fw-bold">
                    <i class="bi bi-people-fill"></i> Quản lý Nhân sự
                </h1>
            </div>
            <div>
                <a th:href="@{/employees/new}" class="btn btn-success shadow-sm">
                    <i class="bi bi-plus-lg"></i> Thêm nhân viên
                </a>
            </div>
        </div>

        <!-- Thanh tìm kiếm & lọc phòng ban -->
        <div class="card bg-secondary bg-opacity-10 border-secondary shadow-sm mb-4">
            <div class="card-body">
                <form method="get" th:action="@{/employees}" class="row g-3">
                    <div class="col-md-5">
                        <input type="text" name="keyword" class="form-control bg-dark text-light border-secondary" placeholder="Nhập họ tên nhân viên để tìm kiếm..." th:value="${keyword}">
                    </div>
                    <div class="col-md-4">
                        <select name="departmentId" class="form-select bg-dark text-light border-secondary">
                            <option value="">-- Tất cả phòng ban --</option>
                            <option th:each="dept : ${departments}" 
                                    th:value="${dept.id}" 
                                    th:text="${dept.name}"
                                    th:selected="${dept.id == selectedDepartmentId}"></option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100">Tìm kiếm</button>
                        <a th:href="@{/employees}" class="btn btn-outline-secondary w-100">Đặt lại</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Bảng danh sách nhân viên -->
        <div class="card bg-secondary bg-opacity-10 border-secondary shadow-lg">
            <div class="card-body p-0">
                <table class="table table-dark table-hover table-striped align-middle mb-0">
                    <thead class="table-dark border-bottom border-secondary text-uppercase fs-7">
                        <tr>
                            <th scope="col" class="py-3 ps-4">#ID</th>
                            <th scope="col" class="py-3">Họ và tên</th>
                            <th scope="col" class="py-3">Email</th>
                            <th scope="col" class="py-3">Lương cơ bản ($)</th>
                            <th scope="col" class="py-3">Phòng ban</th>
                            <th scope="col" class="py-3 text-center pe-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="emp : ${employees}">
                            <th scope="row" class="ps-4 font-monospace text-warning" th:text="${emp.id}">1</th>
                            <td class="fw-bold text-white" th:text="${emp.fullName}">Trần Minh Phúc</td>
                            <td class="text-light" th:text="${emp.email}">phuc@example.com</td>
                            <td class="text-success fw-bold" th:text="${emp.salary}">1500.00</td>
                            <td>
                                <span class="badge bg-info text-dark" th:text="${emp.department != null ? emp.department.name : 'N/A'}">IT</span>
                            </td>
                            <td class="text-center pe-4">
                                <a th:href="@{/employees/edit/{id}(id=${emp.id})}" class="btn btn-outline-warning btn-sm me-1">
                                    <i class="bi bi-pencil-square"></i> Sửa
                                </a>
                                <a th:href="@{/employees/delete/{id}(id=${emp.id})}" 
                                   class="btn btn-outline-danger btn-sm" 
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa nhân viên này?')">
                                   <i class="bi bi-trash"></i> Xóa
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(employees)}">
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                Không tìm thấy nhân viên nào.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
