version: '3.8'

services:
  mysql-db:
    image: mysql:8.0.46
    container_name: enterprise_mysql
    environment:
      MYSQL_DATABASE: enterprise_db
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - enterprise-net

  app:
    build: .
    container_name: enterprise_app
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/enterprise_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
    depends_on:
      - mysql-db
    networks:
      - enterprise-net

volumes:
  mysql_data:

networks:
  enterprise-net:
    driver: bridge