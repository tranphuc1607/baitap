name: Spring Boot CI/CD Pipeline

# Định nghĩa thời điểm kích hoạt pipeline
on:
  push:
    branches: [ "main", "master" ] # Chạy khi có lệnh push lên nhánh chính
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout mã nguồn từ repository lên runner
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Cài đặt môi trường Java 17
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Cấp quyền thực thi cho Maven Wrapper và chạy Test/Build file Jar
    - name: Build with Maven
      run: |
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    # 4. Đăng nhập vào Docker Hub (Tùy chọn nếu bạn muốn đẩy image lên Docker Hub)
    # - name: Log in to Docker Hub
    #   uses: docker/login-action@v3
    #   with:
    #     username: ${{ secrets.DOCKER_USERNAME }}
    #     password: ${{ secrets.DOCKER_PASSWORD }}

    # 5. Build và kiểm tra Docker Image
    - name: Build Docker Image locally
      run: |
        docker build -t baitap-app:latest .

    # 6. Kiểm tra xem Docker Compose có hoạt động không
    - name: Test Docker Compose configuration
      run: |
        docker compose config